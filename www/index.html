<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="แผนที่รวบรวมสวนสาธารณะและพื้นที่พักผ่อนในจังหวัดเชียงใหม่">

    <title>แผนที่สวนสาธารณะในเชียงใหม่</title>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">🌳</div>

                <div>
                    <h1>แผนที่สวนสาธารณะในเชียงใหม่</h1>
                    <p id="status">กำลังโหลดข้อมูล...</p>
                </div>
            </div>

            <div class="search-box">
                <span aria-hidden="true">🔎</span>

                <input id="searchInput" type="search" placeholder="ค้นหาชื่อสถานที่ ตำบล หรืออำเภอ" autocomplete="off">
            </div>
        </header>

        <main>
            <aside class="sidebar">
                <div class="sidebar-heading">
                    <div>
                        <h2>สถานที่ทั้งหมด</h2>
                        <p>เลือกสถานที่เพื่อดูตำแหน่งบนแผนที่</p>
                    </div>

                    <div id="summary" class="summary" aria-live="polite"></div>

                    <div class="filter-block">
                        <div class="filter-title">กรองตามประเภท</div>
                        <div id="categoryFilters" class="category-filters"></div>
                    </div>
                </div>

                <div class="analysis-tools">
                    <details class="tool-card">
                        <summary>📍 ค้นหาสถานที่ใกล้ที่สุด</summary>
                        <div class="tool-content">
                            <p>กรอกพิกัดปัจจุบันของคุณ</p>
                            <div class="coordinate-grid">
                                <label>
                                    ละติจูด
                                    <input id="nearestLat" type="number" step="any" min="-90" max="90" placeholder="18.7883">
                                </label>
                                <label>
                                    ลองจิจูด
                                    <input id="nearestLng" type="number" step="any" min="-180" max="180" placeholder="98.9853">
                                </label>
                            </div>
                            <div class="tool-actions">
                                <button id="useMyLocation" class="secondary-button" type="button">ใช้ตำแหน่งของฉัน</button>
                                <button id="findNearest" class="primary-button" type="button">ค้นหา</button>
                            </div>
                            <div id="nearestResult" class="tool-result" aria-live="polite"></div>
                        </div>
                    </details>

                    <details class="tool-card">
                        <summary>🛣️ เปรียบเทียบ 3 เส้นทาง</summary>
                        <div class="tool-content">
                            <p>กรอกจุดเริ่มต้นและเลือกจุดหมาย</p>
                            <div class="coordinate-grid">
                                <label>
                                    ละติจูดเริ่มต้น
                                    <input id="routeLat" type="number" step="any" min="-90" max="90" placeholder="18.7883">
                                </label>
                                <label>
                                    ลองจิจูดเริ่มต้น
                                    <input id="routeLng" type="number" step="any" min="-180" max="180" placeholder="98.9853">
                                </label>
                            </div>
                            <label class="destination-label">
                                สถานที่ปลายทาง
                                <select id="routeDestination"></select>
                            </label>
                            <div class="tool-actions">
                                <button id="copyCoordinates" class="secondary-button" type="button">ใช้พิกัดด้านบน</button>
                                <button id="calculateRoutes" class="primary-button" type="button">คำนวณเส้นทาง</button>
                            </div>
                            <div id="routeResult" class="tool-result" aria-live="polite"></div>
                        </div>
                    </details>
                </div>

                <div id="placeList"></div>
            </aside>

            <section class="map-section">
                <div id="map"></div>
                <div id="mapLegend" class="map-legend" aria-label="คำอธิบายสีของหมุด"></div>
            </section>
        </main>
    </div>

    <script type="module" src="/app.js"></script>
</body>

</html>
