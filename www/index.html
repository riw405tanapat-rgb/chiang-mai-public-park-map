<!doctype html>
<html lang="th">

<head>
    <!-- ข้อมูลพื้นฐานของหน้าเว็บสำหรับภาษาไทย หน้าจอมือถือ และผลการค้นหา -->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="แผนที่รวบรวมสวนสาธารณะและพื้นที่พักผ่อนในจังหวัดเชียงใหม่">

    <title>แผนที่สวนสาธารณะในเชียงใหม่</title>
</head>

<body>
    <div class="app">
        <!-- แถบด้านบน: ชื่อโครงการ สถานะการโหลดข้อมูล และช่องค้นหา -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">🌳</div>

                <div>
                    <h1>แผนที่สวนสาธารณะในเชียงใหม่</h1>
                    <p id="status">กำลังโหลดข้อมูล...</p>
                </div>
            </div>

            <div class="search-box">
                <span aria-hidden="true">🔎</span>

                <input id="searchInput" type="search" placeholder="ค้นหาชื่อสถานที่ ตำบล หรืออำเภอ" autocomplete="off">
            </div>
        </header>

        <main>
            <!-- แถบด้านข้าง: สรุปข้อมูล ตัวกรอง เครื่องมือวิเคราะห์ และรายการสถานที่ -->
            <aside class="sidebar">
                <div class="sidebar-heading">
                    <div>
                        <h2>สถานที่ทั้งหมด</h2>
                        <p>เลือกสถานที่เพื่อดูตำแหน่งบนแผนที่</p>
                    </div>

                    <div id="summary" class="summary" aria-live="polite"></div>

                    <div class="filter-block">
                        <div class="filter-title">กรองตามประเภท</div>
                        <div id="categoryFilters" class="category-filters"></div>
                    </div>
                </div>

                <div class="analysis-tools">
                    <!-- เครื่องมือหาสถานที่ที่ใกล้ตำแหน่ง GPS หรือจุดที่คลิกบนแผนที่ -->
                    <details class="tool-card">
                        <summary>📍 ค้นหาสถานที่ใกล้ที่สุด</summary>
                        <div class="tool-content">
                            <p>อนุญาตให้เบราว์เซอร์อ่านตำแหน่ง เพื่อปักหมุดและค้นหาสถานที่ใกล้คุณ</p>
                            <div class="tool-actions">
                                <button id="useMyLocation" class="primary-button" type="button">
                                    ◎ ใช้ GPS
                                </button>
                                <button id="pickLocation" class="secondary-button" type="button">
                                    ✚ เลือกบนแผนที่
                                </button>
                            </div>
                            <div id="nearestResult" class="tool-result" aria-live="polite"></div>
                        </div>
                    </details>

                    <!-- เครื่องมือขอเส้นทางทางเลือกสูงสุด 3 เส้นทางจาก OSRM -->
                    <details class="tool-card">
                        <summary>🛣️ เปรียบเทียบ 3 เส้นทาง</summary>
                        <div class="tool-content">
                            <p>ใช้ตำแหน่งที่ปักหมุดไว้เป็นจุดเริ่มต้น แล้วเลือกจุดหมาย</p>
                            <label class="destination-label">
                                สถานที่ปลายทาง
                                <select id="routeDestination"></select>
                            </label>
                            <button id="calculateRoutes" class="primary-button full-button" type="button">คำนวณเส้นทาง</button>
                            <div id="routeResult" class="tool-result" aria-live="polite"></div>
                        </div>
                    </details>
                </div>

                <div id="placeList"></div>
            </aside>

            <!-- พื้นที่แผนที่ Leaflet และคำอธิบายสีของหมุด -->
            <section class="map-section">
                <div id="map"></div>
                <div id="mapLegend" class="map-legend" aria-label="คำอธิบายสีของหมุด"></div>
            </section>
        </main>
    </div>

    <!-- โหลด JavaScript หลักแบบ ES module ผ่าน Vite -->
    <script type="module" src="/app.js"></script>
</body>

</html>
